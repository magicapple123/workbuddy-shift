<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkBuddy Shift · WorkBuddy 账号切换</title>
    <!--
      首屏兜底样式：纯内联，不引用任何外部资源（离线 / 资源加载失败时同样可见）。
      正常启动时 React 挂载会清空 #root，占位自然消失；主题跟随系统，避免深色下闪白。

      样式必须只落在 .wb-boot 上，不要写 body：这段内联样式是「未分层」的，
      而项目 CSS 走 Tailwind 的 @layer base，级联中未分层样式优先于所有分层样式。
      写到 body 上会盖掉应用自己的 body 颜色（--foreground），系统深色 + 应用浅色时
      所有未显式指定颜色的正文文字会继承成兜底用的近白色，看起来像文字消失。
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      .wb-boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        text-align: center;
        background: #ffffff;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .wb-boot-title {
        font-size: 15px;
        font-weight: 600;
      }
      .wb-boot-text {
        max-width: 460px;
        font-size: 12px;
        line-height: 1.7;
        color: #71717a;
      }
      .wb-boot-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 6px;
      }
      .wb-boot-button {
        padding: 7px 14px;
        border: 0;
        border-radius: 8px;
        background: #18181b;
        color: #fafafa;
        font-size: 13px;
        cursor: pointer;
      }
      .wb-boot-link {
        font-size: 12px;
        color: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        .wb-boot {
          background: #18181b;
          color: #fafafa;
        }
        .wb-boot-button {
          background: #fafafa;
          color: #18181b;
        }
        .wb-boot-text,
        .wb-boot-link {
          color: #a1a1aa;
        }
      }
    </style>

    <!--
      R5-17 运行时 WebView 能力检测（未分层、自包含，紧跟首屏样式之后）。

      为什么不用 @layer / 外部文件：老 WebKit（WebKit < 15.4）不认识 `@layer`，会丢弃整块，
      于是 Tailwind 的 theme/base/utilities 全没了，只剩未分层自定义 CSS —— 用户看到裸 HTML。
      所以这段提示必须**只依赖未分层内联样式**：这里不用 class，全部写 style 属性。

      三项能力（与 src/lib/webview-support.ts 的判定一一对应，改一处必须改另一处）：
        - CSSLayerBlockRule      → 认识 `@layer`（WebKit 15.4+），缺了直接阻断
        - CSS.registerProperty   → `@property`（WebKit 16.4+），缺了降级提醒
        - color-mix()            → 半透明背景 / 边框 / hover（WebKit 16.2+），缺了降级提醒

      结果写给 src/main.tsx：blocked 时它**不挂载 React**（首次渲染会清空 #root，
      把这里注入的提示页顶掉）。
    -->
    <script>
      (function () {
        var hasLayer = typeof CSSLayerBlockRule !== "undefined";
        var hasProperty = typeof CSS !== "undefined" && typeof CSS.registerProperty === "function";
        var hasMix =
          typeof CSS !== "undefined" &&
          !!CSS.supports &&
          CSS.supports("color", "color-mix(in srgb, red, blue)");

        var support = !hasLayer ? "blocked" : !hasProperty || !hasMix ? "degraded" : "ok";
        window.__WB_SUPPORT__ = support;
        window.__WB_CAPABILITIES__ = {
          hasLayer: hasLayer,
          hasProperty: hasProperty,
          hasColorMix: hasMix,
        };

        if (support !== "blocked") return;

        var FONT =
          "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif";

        /** 从 UA 取 Safari / WebKit 版本；取不到就写「未知版本」。 */
        function versionLabel() {
          var ua = navigator.userAgent || "";
          var safari = /Version\/(\d+(?:\.\d+)*)/.exec(ua);
          if (safari) return "Safari " + safari[1];
          var webkit = /AppleWebKit\/(\d+(?:\.\d+)*)/.exec(ua);
          if (webkit) return "WebKit " + webkit[1];
          return "未知版本";
        }

        /** 老 WebKit 上没有 flex gap / inset 简写，全部用块级 + margin 与四向定位。 */
        function mountBlockedLayer() {
          if (document.querySelector("[data-webview-blocked]")) return;

          var layer = document.createElement("div");
          layer.setAttribute("data-webview-blocked", "true");
          layer.setAttribute("role", "alertdialog");
          layer.setAttribute("aria-label", "当前系统版本过低，界面无法正常显示");
          layer.style.cssText =
            "position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;" +
            "background:#ffffff;color:#18181b;overflow:auto;padding:40px 28px;" +
            "box-sizing:border-box;font-family:" +
            FONT +
            ";font-size:13px;line-height:1.7;";

          var card = document.createElement("div");
          card.style.cssText = "max-width:520px;margin:0 auto;";

          var title = document.createElement("div");
          title.style.cssText = "font-size:17px;font-weight:600;margin-bottom:12px;";
          title.textContent = "当前系统版本过低，界面无法正常显示";

          var detected = document.createElement("div");
          detected.style.cssText = "color:#71717a;margin-bottom:12px;";
          detected.textContent = "检测到的浏览器内核：" + versionLabel();

          var requirement = document.createElement("div");
          requirement.style.cssText = "margin-bottom:12px;";
          requirement.textContent =
            "本应用界面需要 Safari / WebKit 16.4 及以上（最低 15.4；15.4–16.3 可用但颜色与边框可能异常）。当前内核缺少 CSS @layer 支持，样式表会被整块丢弃，因此这里只显示这条纯文本提示。";

          var howto = document.createElement("div");
          howto.style.cssText = "margin-bottom:12px;";
          howto.textContent =
            "macOS：打开「系统设置 → 通用 → 软件更新」升级到 macOS 13.3 或更高；无法升级系统时，可在 App Store 里单独更新 Safari（Safari 16.4+ 随系统更新提供）。升级后重新打开本应用即可。";

          var footer = document.createElement("div");
          footer.style.cssText =
            "color:#71717a;border-top:1px solid #e4e4e7;padding-top:12px;margin-top:16px;";

          var hint = document.createElement("div");
          hint.style.cssText = "margin-bottom:10px;";
          hint.textContent = "现在可以按 ⌘Q（Windows / Linux 为 Alt+F4）退出本应用。";

          var reload = document.createElement("button");
          reload.type = "button";
          reload.setAttribute("data-webview-blocked-reload", "true");
          reload.style.cssText =
            "display:inline-block;padding:7px 14px;border:1px solid #d4d4d8;border-radius:8px;" +
            "background:#fafafa;color:#18181b;font-size:13px;font-family:" +
            FONT +
            ";cursor:pointer;";
          reload.textContent = "已升级，重新加载";
          reload.addEventListener("click", function () {
            window.location.reload();
          });

          footer.appendChild(hint);
          footer.appendChild(reload);

          card.appendChild(title);
          card.appendChild(detected);
          card.appendChild(requirement);
          card.appendChild(howto);
          card.appendChild(footer);
          layer.appendChild(card);

          // 便于 DevTools / 截图脚本断言
          document.documentElement.setAttribute("data-webview-blocked", "true");
          (document.body || document.documentElement).appendChild(layer);
        }

        if (document.body) mountBlockedLayer();
        else document.addEventListener("DOMContentLoaded", mountBlockedLayer);
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div class="wb-boot">
        <div class="wb-boot-title">正在启动…</div>
        <div class="wb-boot-text">WorkBuddy 账号切换</div>
      </div>
    </div>

    <!--
      入口 JS 未接管（脚本未加载 / 模块语法错误 / 首屏渲染前抛错）时的兜底。

      「还没挂载」不等于「失败」：dev 下 Vite 逐模块转译 + Tailwind 重编译，而
      `tauri dev` 同时还在编译 Rust，磁盘被编译进程占满时首屏可能要几十秒。
      所以给三次机会、逐次放宽（10s → 20s → 30s，合计约 60s），每次都静默重载；
      三次都没起来才展示错误页。计数存在 sessionStorage，绝不无限重载；
      挂载成功后由 src/main.tsx 清掉计数，下次冷启动仍有三条命。

      生产包资源是打包好的，通常第一次就挂载，走不到重载。
    -->
    <script>
      (function () {
        // 第 n 次尝试的等待时间；attempt 从 0 开始。
        var timeouts = [10000, 20000, 30000];
        var attemptKey = "wb-boot-attempt";
        // 与 src/lib/update.ts 的 GITHUB_RELEASE_URL 一致（内联脚本不能引用打包产物）。
        var releaseUrl = "https://github.com/magicapple123/workbuddy-shift/releases/latest";

        var attempt = 0;
        try {
          attempt = Number(window.sessionStorage.getItem(attemptKey) || "0") || 0;
        } catch (e) {
          // 存储不可用：不去重就不能重载（会无限循环），直接按最后一次处理。
          attempt = timeouts.length;
        }
        var timeoutMs = timeouts[Math.min(attempt, timeouts.length - 1)];

        window.setTimeout(function () {
          if (window.__WB_MOUNTED__) return;
          // R5-17：blocked 时不挂载 React（__WB_MOUNTED__ 永远不会置位），
          // 这里必须早退，否则 10 秒后会把内联的能力不足提示页换成「应用启动失败」。
          if (window.__WB_SUPPORT__ === "blocked") return;
          var root = document.getElementById("root");
          if (!root) return;

          // 还有命就再等一轮：先记下已用次数，记不住就不重载（避免无限循环）。
          if (attempt < timeouts.length) {
            var recorded = false;
            try {
              window.sessionStorage.setItem(attemptKey, String(attempt + 1));
              recorded = true;
            } catch (e) {
              recorded = false;
            }
            if (recorded) {
              window.location.reload();
              return;
            }
          }

          var wrap = document.createElement("div");
          wrap.className = "wb-boot";

          var title = document.createElement("div");
          title.className = "wb-boot-title";
          title.textContent = "应用启动失败";

          var text = document.createElement("div");
          text.className = "wb-boot-text";
          text.textContent =
            "界面未能正常加载。可以先点「重新加载」再试一次；如果一直失败，可从托盘菜单「检查更新」升级到最新版本。";

          var actions = document.createElement("div");
          actions.className = "wb-boot-actions";

          var reload = document.createElement("button");
          reload.type = "button";
          reload.className = "wb-boot-button";
          reload.textContent = "重新加载";
          reload.addEventListener("click", function () {
            window.location.reload();
          });

          var link = document.createElement("a");
          link.className = "wb-boot-link";
          link.href = releaseUrl;
          link.target = "_blank";
          link.rel = "noreferrer noopener";
          link.textContent = "前往 GitHub 下载最新版本";

          actions.appendChild(reload);
          actions.appendChild(link);
          wrap.appendChild(title);
          wrap.appendChild(text);
          wrap.appendChild(actions);

          root.textContent = "";
          root.appendChild(wrap);
        }, timeoutMs);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
