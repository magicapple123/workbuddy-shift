# 前端依赖的单一安装入口：仓库根工程 + 内置悬浮窗工程（companion-ui）。
#
# 显式不包含 npm/：它是发布到 registry 的发行包（主包 + 5 个平台分包），
# 有自己的 files/bin/optionalDependencies 语义。一旦纳入 workspace，pnpm 会把
# npm/platform/* 当成成员去 link，发版清单会被污染，平台分包也不再是独立产物。
packages:
  - companion-ui

# pnpm 12（自 v10 起）默认不执行依赖的安装脚本（供应链安全）。Vite 依赖 esbuild 的
# postinstall 校验并落位平台二进制，必须显式放行（由 `pnpm approve-builds` 写入）。
# 其余依赖不需要构建脚本，不在这里放宽。
allowBuilds:
  esbuild: true
