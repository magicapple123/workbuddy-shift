[package]
name = "companion-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "本地共享监控服务及客户端（WorkBuddy Shift 内置悬浮窗）"

# 共享 lint 见根 Cargo.toml 的 [workspace.lints]。
[lints]
workspace = true

[dependencies]
# 仅在 workspace 内使用、不发布到 crates.io：path 依赖不需要 version 钉（避免 bump 版本时漏改）。
companion-core = { path = "../companion-core" }
serde_json.workspace = true
ureq.workspace = true
tiny_http = "0.12"
fs2.workspace = true
uuid = { workspace = true, features = ["v4"] }
