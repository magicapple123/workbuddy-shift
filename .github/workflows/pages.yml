name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 产物索引轮询 + 清理重跑产生的重复 github-pages 产物（见下方两个步骤）。
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy read-only demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build read-only demo
        run: pnpm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # `deploy-pages` 在上传成功后**立刻**查产物，而 GitHub 的产物列表有最终一致性延迟：
      # 2026-11-24 连续两次失败都是「上传成功、deploy 查到 0 个」（v0.3.3 之后的 main 推送），
      # 同一份产物在二十秒后就能查到。先轮询到可见，再把部署交给 deploy-pages。
      #
      # 同时清理**重复**产物：重跑同一个 run 会在原 run 里再传一份 github-pages，
      # deploy-pages 看到 2 个会直接报 "Multiple artifacts ... unexpectedly found"，
      # 且重跑越多越无解。只留最新一份，重跑因此可自愈。
      - name: Wait for Pages artifact to be indexed
        uses: actions/github-script@v7
        with:
          script: |
            const name = "github-pages";
            const deadline = Date.now() + 120 * 1000;
            let list = [];
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name,
                per_page: 100,
              });
              list = data.artifacts;
              core.info(`[pages] ${name} 可见产物数：${list.length}`);
              if (list.length > 0) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (list.length === 0) {
              core.setFailed(
                `等待 120s 仍看不到 ${name} 产物（GitHub 产物索引延迟）；产物已上传成功，重跑本 job 即可`,
              );
              return;
            }
            // 最新的一份保留（API 按创建时间倒序），其余删除，避免重跑导致的重复。
            const [keep, ...stale] = list;
            core.info(`[pages] 保留产物 ${keep.id}（${keep.created_at}），清理 ${stale.length} 份重复产物`);
            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`[pages] 已删除重复产物 ${artifact.id}`);
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 轮询过后仍可能撞上索引抖动；失败不让 job 立刻红，留给下一步重试一次。
        continue-on-error: true

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
